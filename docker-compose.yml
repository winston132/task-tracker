services:
  task-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackflow
    ports:
      - "3000:3000"
    volumes:
      - ./tasks.json:/app/tasks.json
      - ./public:/app/public
      - ./server.js:/app/server.js
      - ./task-cli.js:/app/task-cli.js
    restart: unless-stopped
    environment:
      - NODE_ENV=production

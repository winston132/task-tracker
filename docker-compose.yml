services:
  task-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackflow
    ports:
      - "3000:3000"
    volumes:
      # Mount the tasks.json FILE directly (must exist on host before running)
      - ./tasks.json:/app/tasks.json
    restart: unless-stopped
    environment:
      - NODE_ENV=production
